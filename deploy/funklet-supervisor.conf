; Supervisor program definitions for the Funklet installation.
;
; Install to /etc/supervisor/conf.d/funky_lights.conf on the Pi, then:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Dashboard: http://funkletpi.wlan:9001/
;
; !! EXACTLY ONE controller program may run at a time. !!
; Both controller programs below drive the same two OPC buses. If cached_mode
; and live_mode run together -- or if either runs while someone has also started
; `python main.py` by hand over SSH -- both processes connect to board_1 and
; board_2 and interleave frames from independent pattern rotations. On the
; sculpture that looks like stuttering, or like different patterns running on
; different segments. Check with:  ps aux | grep '[m]ain.py'
;
; Adjust `user` and the paths to match this Pi (check with `whoami`).
;
; The interpreter is the virtualenv's, not bare `python`. Bookworm marks the
; system Python as externally managed (PEP 668), so the project is installed
; into ~/venv -- see deploy/REBUILD.md. A bare `python` here would run a
; system interpreter that has none of the dependencies.

[program:funky_lights_webserver]
environment = PYTHONUNBUFFERED=1
command=/home/funklet/venv/bin/python -m http.server 8000 --directory /home/funklet/funky_lights
user=funklet
autostart=true
autorestart=true

; Plays pre-rendered frames from ~/pattern_cache.
; NOTE: the cache is keyed on a hash of config/led_config.json. Any change to
; that file orphans it, and every pattern then silently falls back to live
; rendering (logged as "No cache found for pattern ..." in ~/funklet.log).
; Rebuild with `python create_pattern_cache.py` after regenerating the LED config.
[program:funky_lights_controller_cached_mode]
environment = PYTHONUNBUFFERED=1
directory=/home/funklet/funky_lights/controller
command=/home/funklet/venv/bin/python main.py -c -b ../config/bus_config.json
user=funklet
autostart=true
autorestart=true

; Renders every frame live. Start this only after stopping cached_mode.
[program:funky_lights_controller_live_mode]
environment = PYTHONUNBUFFERED=1
directory=/home/funklet/funky_lights/controller
command=/home/funklet/venv/bin/python main.py -b ../config/bus_config.json
user=funklet
autostart=false
autorestart=true
