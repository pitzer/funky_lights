; PlatformIO project for the Funklet Teensy OPC server.
;
;   pio run -e board2 -t upload     ; the 192.168.1.5 board
;   pio run -e board1 -t upload     ; the 192.168.1.4 board
;   pio device monitor              ; serial output, 115200

[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200

; If the registry names ever fail to resolve, these are the upstreams:
;   https://github.com/PaulStoffregen/OctoWS2811.git
;   https://github.com/ssilverman/QNEthernet.git
lib_deps =
    paulstoffregen/OctoWS2811
    ssilverman/QNEthernet

; -O2 rather than the default -Os. The pixel copy runs per frame at 20 Hz and
; the board has flash to spare.
build_flags =
    -O2
    -Wall

; ---------------------------------------------------------------------------
; One env per board. These set BOARD, which selects the static IP, the channel
; count and the per-strip LED lengths -- see the top of the .ino. Nothing else
; differs between them.
; ---------------------------------------------------------------------------

; board_1 -- 192.168.1.4, 6 channels
;   tail, leg_front_right, leg_back_right, leg_front_left, leg_back_left,
;   eyes_right
[env:board1]
build_flags = ${env.build_flags} -D BOARD=1

; board_2 -- 192.168.1.5, 8 channels
;   dome, ball, eyes_left, tusks, ear_left, trunk, ear_right, head
[env:board2]
build_flags = ${env.build_flags} -D BOARD=2
